<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Ruso: Vocabulario Base</title>
    <style>
        :root {
            --bg-dark: #0f172a; 
            --bg-card: #1e293b; 
            --bg-item: #334155; 
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8; 
            --accent-yellow: #fbbf24; 
            --accent-green: #22c55e; 
            --accent-red: #ef4444;
            --border-color: #334155;
            --max-web-width: 500px;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .main-wrapper {
            width: 100%;
            max-width: var(--max-web-width);
        }

        .main-title {
            color: var(--accent-yellow);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .search-wrapper {
            width: 100%;
            margin: 0 0 25px 0;
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s;
        }

        .search-wrapper:focus-within { border-color: var(--accent-blue); }

        .search-wrapper input {
            flex: 1; border: none; padding: 14px; font-size: 1rem;
            outline: none; background: transparent; color: white;
        }

        .btn-search {
            background: var(--accent-blue); color: #0f172a; border: none;
            padding: 0 20px; cursor: pointer; font-weight: bold;
        }

        .search-results {
            background: var(--bg-card); border-radius: 12px; margin-bottom: 20px;
            border: 1px solid var(--accent-blue); max-height: 250px; overflow-y: auto;
        }

        .result-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .result-item:hover { background: var(--bg-item); }
        .res-ru { color: var(--accent-yellow); font-weight: bold; display: block; }
        .res-es { color: var(--text-muted); font-size: 0.85rem; }

        .progress-wrapper { 
            width: 100%; background: var(--bg-item); height: 8px; 
            border-radius: 10px; margin-bottom: 20px; overflow: hidden; 
        }
        #progress-bar { 
            width: 0%; height: 100%; background: var(--accent-green); 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .btn-exit {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 8px;
            cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .btn-exit:hover { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        .list-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .list-button {
            background: var(--bg-card); color: var(--text-main); padding: 16px; border-radius: 16px; 
            border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;
        }
        .list-button:hover { border-color: var(--accent-blue); transform: translateY(-2px); }

        .card { 
            background: var(--bg-card); padding: 30px 20px; border-radius: 24px; 
            border: 1px solid var(--border-color); text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .phrase { font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        
        .btn-audio { 
            background: var(--accent-yellow); border: none; width: 60px; height: 60px; 
            border-radius: 50%; cursor: pointer; font-size: 1.5rem; margin-bottom: 25px; 
            box-shadow: 0 4px 0 #b45309; transition: 0.1s; 
        }
        .btn-audio:active { transform: translateY(3px); box-shadow: none; }

        .options { display: grid; gap: 10px; }
        .opt { 
            background: var(--bg-item); border: 1px solid var(--border-color); 
            color: var(--text-main); padding: 14px; border-radius: 12px; 
            cursor: pointer; font-size: 1rem; transition: 0.2s; text-align: left;
        }
        .opt:hover:not(:disabled) { border-color: var(--accent-blue); }
        
        .feedback-area { height: 30px; margin-top: 15px; font-weight: 600; }

        .correct { background: var(--accent-green) !important; color: white !important; }
        .wrong { background: var(--accent-red) !important; color: white !important; }
        
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 24px; max-width: 380px; width: 90%; text-align: center; border: 1px solid var(--accent-blue); animation: pop 0.3s ease-out; }
        
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .error-list { text-align: left; margin: 15px 0; max-height: 200px; overflow-y: auto; background: var(--bg-dark); padding: 12px; border-radius: 12px; font-size: 0.9rem; }
        .error-item { margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .list-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="section-menu">
            <h1 class="main-title">Tutor de Ruso</h1>
            
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Buscar vocabulario..." oninput="searchPhrases()">
                <button class="btn-search" onclick="searchPhrases()">BUSCAR</button>
            </div>

            <div id="search-results-box" class="search-results hidden"></div>

            <p style="color: var(--accent-blue); font-weight: bold; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 15px;">Bloques de estudio móvil</p>
            <div id="menu-items" class="list-grid"></div>
        </div>

        <div id="section-game" class="hidden">
            <div class="progress-wrapper"><div id="progress-bar"></div></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="btn-exit" onclick="showMenu()">✕ SALIR</button>
                <span id="current-list-name" style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold;"></span>
            </div>
            <div class="card">
                <div id="display" class="phrase">---</div>
                <button class="btn-audio" id="audio-trigger" onclick="say()">🔊</button>
                <div id="btns" class="options"></div>
                <div id="feedback-text" class="feedback-area"></div>
            </div>
        </div>
    </div>

    <div id="modal-results" class="modal hidden">
        <div class="modal-content">
            <h2 id="result-title" style="color: var(--accent-yellow); margin-top: 0;">¡Sesión Lista!</h2>
            <p id="result-stat" style="font-size: 1.1rem; color: var(--text-main);"></p>
            <div id="error-container" class="hidden">
                <p style="color: var(--accent-red); font-size: 0.7rem; font-weight: bold; text-align: left; margin-bottom: 5px;">REPASAR TERMINACIONES:</p>
                <div id="error-list" class="error-list"></div>
            </div>
            <button onclick="showMenu()" style="background: var(--accent-blue); color: #0f172a; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;">VOLVER</button>
        </div>
    </div>

<script>
    const data = [
        // --- PRONOMBRES Y POSESIVOS ---
        { r: "Я", s: "Yo" },
        { r: "Ты", s: "Tú" },
        { r: "Он", s: "Él" },
        { r: "Она", s: "Ella" },
        { r: "Мы", s: "Nosotros" },
        { r: "Они", s: "Ellos" },
        { r: "Мой дом", s: "Mi casa" },
        { r: "Твой друг", s: "Tu amigo" },
        { r: "Наш сын", s: "Nuestro hijo" },

        // --- SUSTANTIVOS: FAMILIA ---
        { r: "Мама", s: "Mamá" },
        { r: "Папа", s: "Papá" },
        { r: "Сын", s: "Hijo" },
        { r: "Дочь", s: "Hija" },
        { r: "Брат", s: "Hermano" },
        { r: "Сестра", s: "Hermana" },
        { r: "Муж", s: "Esposo" },
        { r: "Жена", s: "Esposa" },
        { r: "Друг", s: "Amigo" },
        { r: "Подруga", s: "Amiga" },

        // --- SUSTANTIVOS: LUGARES Y OBJETOS ---
        { r: "Город", s: "Ciudad" },
        { r: "Дом", s: "Casa" },
        { r: "Здание", s: "Edificio" },
        { r: "Книга", s: "Libro" },
        { r: "Ручка", s: "Bolígrafo" },
        { r: "Карандаш", s: "Lápiz" },

        // --- FRASES CORTAS ---
        { r: "Привет", s: "Hola" },
        { r: "Да, я знаю", s: "Sí, yo sé" },
        { r: "Нет, яね знаю", s: "No, yo no sé" },
        { r: "Я понял", s: "Entendí" }
    ];

    let currentSubset = [];
    let idx = 0;
    let errors = [];
    let audioCtx = null;
    let autoPlayTimer = null;

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function searchPhrases() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const resultsBox = document.getElementById('search-results-box');
        if (query.length < 2) { resultsBox.classList.add('hidden'); return; }
        const filtered = data.filter(item => item.r.toLowerCase().includes(query) || item.s.toLowerCase().includes(query));
        if (filtered.length > 0) {
            resultsBox.classList.remove('hidden');
            resultsBox.innerHTML = filtered.map(item => `<div class="result-item" onclick="playSearchAudio('${item.r}')"><span class="res-ru">${item.r}</span><span class="res-es">${item.s}</span></div>`).join("");
        } else { resultsBox.innerHTML = "<p style='padding:15px; color:gray; font-size:0.8rem;'>Sin coincidencia.</p>"; }
    }

    function playSearchAudio(text) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }

    function playDing() {
        initAudio();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function playError() {
        initAudio();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function showMenu() {
        clearTimeout(autoPlayTimer);
        window.speechSynthesis.cancel();
        document.getElementById('section-menu').classList.remove('hidden');
        document.getElementById('section-game').classList.add('hidden');
        document.getElementById('modal-results').classList.add('hidden');
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menu-items');
        container.innerHTML = "";
        for(let i = 1; i <= Math.ceil(data.length/10); i++) {
            const btn = document.createElement('button');
            btn.className = 'list-button';
            btn.onclick = () => startList(i);
            btn.innerHTML = `<div style="font-size:0.7rem; color:var(--accent-blue); font-weight:bold;">TANDA ${i}</div>
                             <div style="font-weight:bold; margin-top:4px;">Palabras ${(i*10)-9}-${Math.min(i*10, data.length)}</div>`;
            container.appendChild(btn);
        }
    }

    function startList(num) {
        currentSubset = data.slice((num-1)*10, num*10);
        idx = 0; errors = [];
        document.getElementById('current-list-name').innerText = `BLOQUE PRÁCTICO ${num}`;
        document.getElementById('section-menu').classList.add('hidden');
        document.getElementById('section-game').classList.remove('hidden');
        loadQuestion();
    }

    function say(cb = null) {
        const btn = document.getElementById('audio-trigger');
        btn.style.transform = "scale(1.1)";
        const item = currentSubset[idx];
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(item.r); 
        u.lang = 'ru-RU'; u.rate = 0.8;
        u.onend = () => { btn.style.transform = "scale(1)"; if(cb) cb(); };
        window.speechSynthesis.speak(u);
    }

    function loadQuestion() {
        clearTimeout(autoPlayTimer);
        document.getElementById('progress-bar').style.width = (idx / currentSubset.length * 100) + "%";
        const item = currentSubset[idx];
        document.getElementById('feedback-text').innerText = "";
        document.getElementById('display').innerText = item.r;
        
        const others = data.filter(x => x.s !== item.s).sort(() => Math.random() - 0.5).slice(0, 2);
        const opts = [item.s, ...others.map(o => o.s)].sort(() => Math.random() - 0.5);
        
        const div = document.getElementById('btns');
        div.innerHTML = "";
        opts.forEach(o => {
            const b = document.createElement('button'); b.className = 'opt'; b.innerText = o;
            b.onclick = () => {
                clearTimeout(autoPlayTimer);
                window.speechSynthesis.cancel();
                document.querySelectorAll('.opt').forEach(btn => btn.disabled = true);
                if(o === item.s) {
                    b.classList.add('correct'); playDing(); setTimeout(next, 800);
                } else {
                    b.classList.add('wrong'); playError(); errors.push(item); setTimeout(next, 1200);
                }
            };
            div.appendChild(b);
        });

        autoPlayTimer = setTimeout(() => {
            if (!document.getElementById('section-game').classList.contains('hidden')) {
                say();
            }
        }, 1500);
    }

    function next() {
        idx++;
        if (idx >= currentSubset.length) { showResults(); }
        else loadQuestion();
    }

    function showResults() {
        document.getElementById('modal-results').classList.remove('hidden');
        document.getElementById('result-stat').innerText = `Aciertos: ${currentSubset.length - errors.length} / ${currentSubset.length}`;
        if(errors.length > 0) {
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-list').innerHTML = errors.map(e => `<div class="error-item"><span style="color:var(--accent-yellow)">${e.r}</span> ➔ <span style="color:var(--text-muted)">${e.s}</span></div>`).join("");
        } else {
            document.getElementById('error-container').classList.add('hidden');
            document.getElementById('result-title').innerText = "¡Perfecto! 🏆";
        }
    }

    window.onload = showMenu;
</script>
</body>
</html>
