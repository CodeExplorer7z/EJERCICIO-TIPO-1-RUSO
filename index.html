<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRÁCTICA DE RUSO - EXPERIENCIA DUO</title>
    <style>
        :root {
            --bg-dark: #121212; 
            --bg-card: #1e1e1e; 
            --bg-item: #2a2a2a; 
            --text-main: #e0e0e0; 
            --accent-blue: #3498db; 
            --accent-yellow: #f1c40f; 
            --accent-green: #2ecc71; 
            --accent-red: #e74c3c;
            --border-color: #333333;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px; 
        }

        .progress-wrapper { width: 100%; max-width: 450px; background: #333; height: 12px; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 1px solid #444; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-green), #a2ffcf); transition: width 0.5s ease; }

        .btn-exit {
            background: rgba(231, 76, 60, 0.1); color: var(--accent-red);
            border: 2px solid var(--accent-red); padding: 8px 18px; border-radius: 12px;
            font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn-exit:hover { background: var(--accent-red); color: white; }

        .menu-container { width: 100%; max-width: 800px; text-align: center; }
        .list-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        
        .list-button {
            background: var(--bg-card); color: var(--text-main); padding: 15px; border-radius: 15px; 
            border: 2px solid var(--border-color); cursor: pointer; transition: 0.3s;
        }
        .list-button:hover { border-color: var(--accent-blue); transform: translateY(-3px); }

        .card { 
            background: var(--bg-card); padding: 30px; border-radius: 25px; 
            border: 1px solid var(--border-color); width: 100%; max-width: 450px; 
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .phrase { font-size: 1.7rem; font-weight: bold; color: var(--accent-blue); margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        
        .btn-audio { 
            background: var(--accent-yellow); border: none; width: 65px; height: 65px; 
            border-radius: 50%; cursor: pointer; font-size: 1.8rem; margin-bottom: 25px; 
            box-shadow: 0 5px 0 #c4a00a; transition: 0.1s;
        }
        .btn-audio:active { transform: translateY(4px); box-shadow: none; }

        .options { display: grid; gap: 12px; }
        .opt { 
            background: var(--bg-item); border: 2px solid transparent; color: var(--text-main); 
            padding: 16px; border-radius: 15px; cursor: pointer; font-size: 1.05rem; transition: 0.2s; text-align: left;
        }
        
        .feedback-area { height: 30px; margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
        .msg-error { color: var(--accent-red); animation: shake 0.4s; }
        .msg-correct { color: var(--accent-green); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .correct { background: var(--accent-green) !important; color: #1a1a1a !important; font-weight: bold; }
        .wrong { background: var(--accent-red) !important; color: white !important; font-weight: bold; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--bg-card); padding: 40px; border-radius: 30px; max-width: 420px; width: 90%; text-align: center; border: 2px solid var(--accent-blue); }
        .error-list { text-align: left; margin: 20px 0; max-height: 250px; overflow-y: auto; background: #121212; padding: 15px; border-radius: 15px; }
        .error-item { padding: 10px 0; border-bottom: 1px solid #333; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="section-menu" class="menu-container">
        <h1 style="color: var(--accent-yellow); font-size: 2.8rem; margin-bottom: 5px;">РУССКИЙ</h1>
        <p style="color: var(--accent-blue); font-weight: bold;">SISTEMA DE APRENDIZAJE</p>
        <div id="menu-items" class="list-grid"></div>
    </div>

    <div id="section-game" class="hidden">
        <div class="progress-wrapper"><div id="progress-bar"></div></div>
        <div style="width: 100%; max-width: 450px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-exit" onclick="showMenu()">✕ Salir</button>
            <span id="current-list-name" style="font-weight: bold; color: var(--text-muted);"></span>
        </div>
        <div class="card">
            <div id="display" class="phrase">---</div>
            <button class="btn-audio" onclick="say()">🔊</button>
            <div id="btns" class="options"></div>
            <div id="feedback-text" class="feedback-area"></div>
        </div>
    </div>

    <div id="modal-results" class="modal hidden">
        <div class="modal-content">
            <h2 id="result-title" style="color: var(--accent-yellow);">¡Sesión Finalizada!</h2>
            <p id="result-stat" style="font-size: 1.3rem; margin: 15px 0;"></p>
            <div id="error-container" class="hidden">
                <p style="color: var(--accent-red); font-weight: bold;">Repasar errores:</p>
                <div id="error-list" class="error-list"></div>
            </div>
            <button onclick="showMenu()" style="background: var(--accent-blue); color: white; border: none; padding: 18px; border-radius: 15px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px;">CONTINUAR</button>
        </div>
    </div>

<script>
    const data = [
        { r: "Привет, как тебя зовут?", s: "¿Hola, cómo te llamas?" },
        { r: "Я знаю esto место.", s: "Yo conozco este lugar." },
        { r: "Я думаю, это хорошая идея.", s: "Pienso que es una buena idea." },
        { r: "Это длинное слово.", s: "Esta es una palabra muy larga." },
        { r: "Подожди, я сейчас приду.", s: "Espera, ahora vengo." },
        { r: "Давай пойдём в парк.", s: "Vamos al parque." },
        { r: "Я всё понял, спасибо.", s: "Lo entendí todo, gracias." },
        { r: "Короче, мы опоздали.", s: "En fin, llegamos tarde." },
        { r: "Кстати, где мой чай?", s: "Por cierto, ¿dónde está mi té?" },
        { r: "Ладно, давай сделаем это.", s: "Está bien, hagámoslo." },
        { r: "Ничего, всё нормально.", s: "No es nada, todo bien." },
        { r: "Осталось мало времени.", s: "Queda poco tiempo." },
        { r: "Слышишь, что он говорит?", s: "¿Oyes lo que él dice?" },
        { r: "Тебе очень идёт это платье!", s: "¡Te queda muy bien ese vestido!" },
        { r: "Ясненько, я всё сделаю.", s: "Vale, yo me encargo de todo." },
        { r: "Капец, как тут холодно!", s: "¡Vaya, qué frío hace aquí!" },
        { r: "Блин, я забыл ключи.", s: "Rayos, olvidé las llaves." },
        { r: "Как дела?", s: "¿Cómo estás?" },
        { r: "Лучше всех", s: "Mejor que todos." },
        { r: "Всё пучком", s: "Todo va de maravilla." }
    ];

    let currentSubset = [];
    let idx = 0;
    let errors = [];
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playDing() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function playError() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    // SONIDO FINAL (Basado en el video de Duolingo)
    function playFinalSuccess() {
        initAudio();
        const tones = [523.25, 659.25, 783.99, 1046.50]; // Acorde de Do Mayor (C Major)
        tones.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.05));
            gain.gain.setValueAtTime(0, audioCtx.currentTime + (i * 0.05));
            gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + (i * 0.05) + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + (i * 0.05));
            osc.stop(audioCtx.currentTime + 1.5);
        });
    }

    function showMenu() {
        document.getElementById('section-menu').classList.remove('hidden');
        document.getElementById('section-game').classList.add('hidden');
        document.getElementById('modal-results').classList.add('hidden');
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menu-items');
        container.innerHTML = "";
        for(let i = 1; i <= Math.ceil(data.length/10); i++) {
            const btn = document.createElement('button');
            btn.className = 'list-button';
            btn.onclick = () => startList(i);
            btn.innerHTML = `🇷🇺 <b>BLOQUE ${i}</b><br><small>Frases 1 a 10</small>`;
            container.appendChild(btn);
        }
    }

    function startList(num) {
        currentSubset = data.slice((num-1)*10, num*10);
        idx = 0; errors = [];
        document.getElementById('current-list-name').innerText = `LISTA ${num}`;
        document.getElementById('section-menu').classList.add('hidden');
        document.getElementById('section-game').classList.remove('hidden');
        loadQuestion();
    }

    function updateProgressBar() {
        document.getElementById('progress-bar').style.width = (idx / currentSubset.length * 100) + "%";
    }

    function say(cb = null) {
        const item = currentSubset[idx];
        const a = new Audio(`audios/audio_${data.indexOf(item)}.mp3`);
        a.play().then(() => { if(cb) a.onended = cb; }).catch(() => fallbackTTS(item.r, cb));
    }

    function fallbackTTS(text, cb) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ru-RU'; u.rate = 0.8;
        if(cb) u.onend = cb; window.speechSynthesis.speak(u);
    }

    function loadQuestion() {
        updateProgressBar();
        const item = currentSubset[idx];
        const feedback = document.getElementById('feedback-text');
        feedback.innerHTML = "";
        document.getElementById('display').innerText = item.r;
        
        const others = data.filter(x => x.s !== item.s).sort(() => Math.random() - 0.5).slice(0, 2);
        const opts = [item.s, ...others.map(o => o.s)].sort(() => Math.random() - 0.5);

        const div = document.getElementById('btns');
        div.innerHTML = "";
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'opt'; b.innerText = o;
            b.onclick = () => {
                document.querySelectorAll('.opt').forEach(btn => btn.disabled = true);
                if(o === item.s) {
                    b.classList.add('correct');
                    feedback.innerHTML = `<span class="msg-correct">✓ ¡Excelente!</span>`;
                    playDing();
                    setTimeout(next, 1000);
                } else {
                    b.classList.add('wrong');
                    feedback.innerHTML = `<span class="msg-error">✕ Incorrecto</span>`;
                    playError();
                    errors.push(item);
                    setTimeout(next, 1600);
                }
            };
            div.appendChild(b);
        });
    }

    function next() {
        idx++;
        if (idx >= currentSubset.length) { 
            updateProgressBar(); 
            playFinalSuccess(); // Sonido de lección terminada
            setTimeout(showResults, 400); 
        }
        else loadQuestion();
    }

    function showResults() {
        document.getElementById('modal-results').classList.remove('hidden');
        document.getElementById('result-stat').innerText = `Lograste ${currentSubset.length - errors.length} de ${currentSubset.length} aciertos`;
        const container = document.getElementById('error-container');
        if(errors.length > 0) {
            container.classList.remove('hidden');
            document.getElementById('error-list').innerHTML = errors.map(e => `<div class="error-item">🇷🇺 <b>${e.r}</b><br>🇪🇸 ${e.s}</div>`).join("");
        } else {
            container.classList.add('hidden');
            document.getElementById('result-title').innerText = "¡Puntuación Perfecta! 🏆";
        }
    }

    window.onload = showMenu;
</script>
</body>
</html>
